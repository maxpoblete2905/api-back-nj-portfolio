## deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-back-nj-portfolio
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-back-nj-portfolio
  template:
    metadata:
      labels:
        app: api-back-nj-portfolio
    spec:
      containers:
      - name: api-container
        image: $ECR_REGISTRY/$ECR_REPOSITORY:$GIT_SHA
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
