apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-back-nj-portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-back-nj-portfolio
  template:
    metadata:
      labels:
        app: api-back-nj-portfolio
    spec:
      containers:
      - name: api-back-nj-portfolio
        image: $ECR_REGISTRY/api-back-nj-portfolio:$GIT_SHA
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            cpu: '100m'
            memory: '128Mi'
          limits:
            cpu: '250m'
            memory: '256Mi'
