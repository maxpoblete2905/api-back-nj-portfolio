apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-back-nj-portfolio-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
  - host: api.${{ github.ref_name }}.tudominio.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-back-nj-portfolio-service
            port:
              number: 80
