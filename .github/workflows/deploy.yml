name: Deploy Pipeline Completo

on:
  push:
    branches: [main, development, staging, production]
  workflow_dispatch:

env:
  EKS_CLUSTER_NAME: cluster-test-integracion-continua
  AWS_REGION: us-east-2
  ECR_REPOSITORY: api-back-nj-portfolio
  K8S_NAMESPACE: default

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, Push Docker Image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Export ECR Registry
        id: export-ecr
        run: |
          echo "registry=${{ steps.ecr-login.outputs.registry }}" >> $GITHUB_OUTPUT

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}
          audience: sts.amazonaws.com

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure EKS Access
        run: |
          aws sts get-caller-identity
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --role-arn ${{ secrets.AWS_ASSUME_ROLE }}
          kubectl cluster-info
          kubectl get ns

      - name: Set ECR Registry
        id: get-ecr
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)
          echo "registry=${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Decode Firebase JSON
        env:
          FIREBASE_BASE64: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
        run: |
          echo "$FIREBASE_BASE64" | base64 --decode > firebase.json
          if ! jq -e '.' firebase.json > /dev/null 2>/tmp/jq-error; then
            echo "❌ Invalid JSON after Base64 decode"
            cat /tmp/jq-error
            head -n 3 firebase.json
            exit 1
          fi

      - name: Create Kubernetes Secret for Firebase
        run: |
          kubectl create secret generic firebase-secret \
            --from-file=firebase.json=firebase.json \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Kubernetes Resources
        env:
          ECR_REGISTRY: ${{ steps.get-ecr.outputs.registry }}
          GIT_SHA: ${{ github.sha }}
          MAIL_USER: ${{ secrets.MAILTRAP_USER }}
          MAIL_PASS: ${{ secrets.MAILTRAP_PASS }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          echo "🚀 Imagen que se usará en el deployment: $ECR_REGISTRY/$ECR_REPOSITORY:$GIT_SHA"

          helm upgrade --install api-back ./helm/api-back \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --set image.repository=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }} \
            --set image.tag=$GIT_SHA \
            --set secret.SECRET="$APP_SECRET" \
            --set secret.MAIL_USER="$MAIL_USER" \
            --set secret.MAIL_PASS="$MAIL_PASS"

          echo "📦 Verificando el rollout del deployment..."
          if ! kubectl rollout status deployment/api-back-deployment -n ${{ env.K8S_NAMESPACE }} --timeout=180s; then
            echo "❌ El rollout falló. Obteniendo más detalles..."

            echo "🔍 Lista de pods:"
            kubectl get pods -n ${{ env.K8S_NAMESPACE }}

            echo "🔍 Descripción de los pods:"
            kubectl describe pods -l app=api-back-nj-portfolio -n ${{ env.K8S_NAMESPACE }}

            echo "🧾 Últimos logs de los pods:"
            kubectl logs -l app=api-back-nj-portfolio -n ${{ env.K8S_NAMESPACE }} --tail=100

            exit 1
          else
            echo "✅ Deployment exitoso"
          fi

          shred -u firebase.json || rm -f firebase.json
