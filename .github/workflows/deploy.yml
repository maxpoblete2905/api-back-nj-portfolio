name: Deploy Pipeline Completo

on:
  push:
    branches: [main, development, staging, production]
  workflow_dispatch:

env:
  EKS_CLUSTER_NAME: cluster-test-integracion-continua
  AWS_REGION: us-east-2
  ECR_REPOSITORY: api-back-nj-portfolio
  K8S_NAMESPACE: default

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Build
          role-duration-seconds: 3600

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          region: ${{ env.AWS_REGION }}

      - name: Build, Tag, and Push Docker Image
        run: |
          # Build Docker image with cache
          docker build \
            -t ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            --build-arg ENVIRONMENT=prod \
            .
          
          # Push to ECR
          docker push ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Deploy
          role-duration-seconds: 3600

      - name: Set Up Kubectl Authentication
        run: |
          # Clean previous configurations
          rm -rf ~/.kube/config
          
          # Configure kubeconfig with retry logic
          max_retries=3
          attempt=0
          until [ $attempt -ge $max_retries ]
          do
            aws eks update-kubeconfig \
              --name ${{ env.EKS_CLUSTER_NAME }} \
              --region ${{ env.AWS_REGION }} \
              --role-arn ${{ secrets.AWS_ASSUME_ROLE }} \
              --alias eks-cluster \
              --no-include-email && break
            attempt=$((attempt+1))
            sleep 5
          done
          
          # Verify connectivity
          kubectl config view
          kubectl cluster-info
          kubectl get ns --request-timeout=10s

      - name: Deploy Kubernetes Resources
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MAIL_USER: ${{ secrets.MAILTRAP_USER }}
          MAIL_PASS: ${{ secrets.MAILTRAP_PASS }}
        run: |
          set -e  # Exit immediately if any command fails
          
          # Create temporary secret file
          echo "$FIREBASE_JSON" > firebase.json
          
          # Apply secrets with validation disabled
          kubectl create secret generic app-secrets \
            --from-literal=SECRET=${{ secrets.APP_SECRET }} \
            --from-literal=MAIL_USER=$MAIL_USER \
            --from-literal=MAIL_PASS=$MAIL_PASS \
            --from-file=FIREBASE_SERVICE_ACCOUNT_JSON=firebase.json \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -
          
          # Clean up
          rm -f firebase.json

          # Apply all Kubernetes manifests
          for manifest in k8s/{configmap,deployment,service,ingress}.yml; do
            echo "Applying $manifest..."
            kubectl apply -f $manifest --validate=false
          done

          # Verify deployment status
          kubectl rollout status deployment/api-back-nj-portfolio -n ${{ env.K8S_NAMESPACE }} --timeout=90s
          
          # Get service info
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}
