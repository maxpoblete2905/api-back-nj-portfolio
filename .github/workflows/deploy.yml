name: Deploy Pipeline Completo

on:
  push:
    branches: [main, development, staging, production]
  workflow_dispatch:

env:
  EKS_CLUSTER_NAME: cluster-test-integracion-continua
  AWS_REGION: us-east-2
  ECR_REPOSITORY: api-back-nj-portfolio
  K8S_NAMESPACE: default

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, Push Docker Image
        run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          docker push ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Kubernetes Resources
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          GIT_SHA: ${{ github.sha }}
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MAIL_USER: ${{ secrets.MAILTRAP_USER }}
          MAIL_PASS: ${{ secrets.MAILTRAP_PASS }}
        run: |
          echo "$FIREBASE_JSON" > firebase.json
          kubectl create secret generic api-back-secrets \
            --from-literal=SECRET=${{ secrets.APP_SECRET }} \
            --from-literal=MAIL_USER=$MAIL_USER \
            --from-literal=MAIL_PASS=$MAIL_PASS \
            --from-file=FIREBASE_SERVICE_ACCOUNT_JSON=firebase.json \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f firebase.json

          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/ingress.yml

          kubectl rollout status deployment/api-back-deployment -n ${{ env.K8S_NAMESPACE }} --timeout=180s
          kubectl get svc,ing -n ${{ env.K8S_NAMESPACE }}