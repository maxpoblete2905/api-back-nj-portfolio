name: Deploy Pipeline Completo

on:
  push:
    branches: [main, development, staging, production]
  workflow_dispatch:

env:
  EKS_CLUSTER_NAME: cluster-test-integracion-continua
  AWS_REGION: us-east-2
  ECR_REPOSITORY: api-back-nj-portfolio
  K8S_NAMESPACE: default

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, Push Docker Image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Export ECR Registry
        id: export-ecr
        run: |
          echo "registry=${{ steps.ecr-login.outputs.registry }}" >> $GITHUB_OUTPUT

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}
          audience: sts.amazonaws.com

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure EKS Access
        run: |
          aws sts get-caller-identity
          
          # Update kubeconfig with explicit role ARN
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --role-arn ${{ secrets.AWS_ASSUME_ROLE }}
          
          # Verify access
          kubectl cluster-info
          kubectl get ns

      - name: Get ECR Registry
        id: get-ecr
        run: |
          echo "registry=$(aws ecr describe-registry --query 'registryId' --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Deploy Kubernetes Resources
        env:
          ECR_REGISTRY: ${{ steps.get-ecr.outputs.registry }}
          GIT_SHA: ${{ github.sha }}
          FIREBASE_BASE64: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
          MAIL_USER: ${{ secrets.MAILTRAP_USER }}
          MAIL_PASS: ${{ secrets.MAILTRAP_PASS }}
        run: |
          # Decode Firebase JSON
          echo "$FIREBASE_BASE64" | base64 --decode > firebase.json
          
          # Validate JSON
          if ! jq -e '.' firebase.json > /dev/null 2>/tmp/jq-error; then
            echo "❌ Invalid JSON after Base64 decode"
            cat /tmp/jq-error
            head -n 3 firebase.json
            exit 1
          fi

          # Create secret
          kubectl create secret generic api-back-secrets \
            --from-literal=SECRET=${{ secrets.APP_SECRET }} \
            --from-literal=MAIL_USER=$MAIL_USER \
            --from-literal=MAIL_PASS=$MAIL_PASS \
            --from-file=FIREBASE_SERVICE_ACCOUNT_JSON=firebase.json \
            --dry-run=client -o yaml | kubectl apply -f - --validate=false

          # Log image path
          echo "🚀 Imagen que se usará en el deployment: $ECR_REGISTRY/$ECR_REPOSITORY:$GIT_SHA"

          # Apply manifests
          for manifest in k8s/configmap.yml k8s/deployment.yml k8s/service.yml k8s/ingress.yml; do
            kubectl apply -f $manifest --validate=false
          done


          # Verify deployment
          kubectl rollout status deployment/api-back-deployment -n ${{ env.K8S_NAMESPACE }} --timeout=180s || {
            kubectl describe deployment/api-back-deployment -n ${{ env.K8S_NAMESPACE }}
            kubectl logs -l app=api-back -n ${{ env.K8S_NAMESPACE }} --tail=50
            exit 1
          }

          # Cleanup
          shred -u firebase.json || rm -f firebase.json