name: Deploy Pipeline Completo

on:
  push:
    branches: [main, development, staging, production]
  workflow_dispatch:

env:
  EKS_CLUSTER_NAME: cluster-test-integracion-continua
  AWS_REGION: us-east-2
  ECR_REPOSITORY: api-back-nj-portfolio
  K8S_NAMESPACE: default

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, Push Docker Image
        run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          docker push ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Configure kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Kubernetes Resources
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          GIT_SHA: ${{ github.sha }}
          FIREBASE_BASE64: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
          MAIL_USER: ${{ secrets.MAILTRAP_USER }}
          MAIL_PASS: ${{ secrets.MAILTRAP_PASS }}
        run: |
          # Decodificar Base64 a JSON
          echo "Decodificando JSON de Firebase..."
          echo "$FIREBASE_BASE64" | base64 --decode > firebase.json
          
          # Validación robusta
          if ! jq -e '.' firebase.json > /dev/null 2>/tmp/jq-error; then
            echo "❌ Error: JSON inválido después de decodificar Base64"
            echo "Detalles del error:"
            cat /tmp/jq-error
            echo "--- Primeras líneas del archivo ---"
            head -n 3 firebase.json
            exit 1
          fi

          echo "✅ JSON validado correctamente"

          # Verificar campos críticos del JSON
          REQUIRED_FIELDS=("type" "project_id" "private_key" "client_email")
          for field in "${REQUIRED_FIELDS[@]}"; do
            if ! jq -e ".${field}" firebase.json > /dev/null; then
              echo "❌ Error: Campo requerido '${field}' no encontrado en el JSON"
              exit 1
            fi
          done

          # Crear secret con validación
          kubectl create secret generic api-back-secrets \
            --from-literal=SECRET=${{ secrets.APP_SECRET }} \
            --from-literal=MAIL_USER=$MAIL_USER \
            --from-literal=MAIL_PASS=$MAIL_PASS \
            --from-file=FIREBASE_SERVICE_ACCOUNT_JSON=firebase.json \
            --dry-run=client -o yaml | kubectl apply -f - --validate=false

          # Aplicar manifiestos con reintentos
          for manifest in k8s/configmap.yml k8s/deployment.yml k8s/service.yml k8s/ingress.yml; do
            echo "🔹 Aplicando $manifest..."
            kubectl apply -f $manifest --validate=false || (echo "❌ Error aplicando $manifest"; exit 1)
          done

          # Verificación del despliegue
          echo "🔄 Verificando estado del despliegue..."
          kubectl rollout status deployment/api-back-deployment -n ${{ env.K8S_NAMESPACE }} --timeout=180s || {
            echo "❌ Error en el despliegue"
            kubectl describe deployment/api-back-deployment -n ${{ env.K8S_NAMESPACE }}
            kubectl logs -l app=api-back -n ${{ env.K8S_NAMESPACE }} --tail=50
            exit 1
          }

          # Mostrar información final
          echo "✅ Despliegue completado con éxito"
          kubectl get svc,ing,pods -n ${{ env.K8S_NAMESPACE }}

          # Limpieza segura
          shred -u firebase.json || rm -f firebase.json