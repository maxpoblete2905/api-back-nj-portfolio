name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Crear archivo key.pem desde secret base64
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Agregar host a known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Crear archivo firebase.json desde secret base64
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | base64 -d > firebase.json

      - name: Transferir archivo firebase.json al servidor EC2
        run: |
          scp -i key.pem firebase.json ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/api-back-nj-portfolio/firebase.json

      - name: Agregar key al agente SSH y ejecutar despliegue
        run: |
          eval "$(ssh-agent -s)"
          ssh-add key.pem
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << EOF
            cd ~/api-back-nj-portfolio

            # Crear archivo .env con variables de entorno desde secrets
            cat > .env <<EOL
            FIREBASE_CONFIG_PATH=/home/ubuntu/api-back-nj-portfolio/firebase.json
            PORT=8080
            SECRET=${{ secrets.APP_SECRET }}
            NODE_ENV=localhost
            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            MAIL_USER=${{ secrets.MAIL_USER }}
            MAIL_PASS=${{ secrets.MAIL_PASS }}
            EOL

            git pull origin main
            npm install
            npm run build

            pm2 restart api-nestjs --update-env || pm2 start dist/main.js --name api-nestjs --update-env
          EOF
